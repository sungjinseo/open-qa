rules:
  - id: go.ignored-error
    languages: [go]
    severity: WARNING
    message: "error 반환값을 _로 버리면 실패를 놓쳐 잘못된 값으로 계속 진행합니다. 에러를 확인하고 처리하세요."
    pattern: |
      $X, _ := $F(...)
    metadata:
      qualgate_id: go.ignored-error
      qualgate_severity: medium
      qualgate_category: reliability
