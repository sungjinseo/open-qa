rules:
  - id: go.resource-not-closed
    languages: [go]
    severity: INFO
    message: "[행안부 CE-02 부적절한 자원 해제] 파일을 열거나 HTTP 응답을 받고 defer Close()를 호출하지 않았습니다. 파일 핸들·커넥션이 누수되어 서비스가 멈출 수 있습니다. 오류 확인 직후 defer f.Close() 를 두세요."
    pattern-either:
      - patterns:
          - pattern: $F, $E := os.Open($P)
          - pattern-not-inside: |
              $F, $E := os.Open($P)
              ...
              defer $F.Close()
      - patterns:
          - pattern: $R, $E := http.Get($U)
          - pattern-not-inside: |
              $R, $E := http.Get($U)
              ...
              defer $R.Body.Close()
    metadata:
      qualgate_id: go.resource-not-closed
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: CE-02
      cwe: "CWE-404"
