rules:
  - id: go.permissive-file-mode
    languages: [go]
    severity: WARNING
    message: "[행안부 SF-03 중요한 자원에 대한 잘못된 권한 설정] 파일·디렉터리를 모든 사용자가 읽고 쓸 수 있게 권한을 설정합니다. 다른 계정이 설정·키·업로드 파일을 열람하거나 변조할 수 있습니다. 필요한 최소 권한(0600, 0750)을 쓰세요."
    patterns:
      - pattern-either:
          - pattern: os.Chmod($P, $M)
          - pattern: os.WriteFile($P, $D, $M)
          - pattern: os.MkdirAll($P, $M)
          - pattern: os.Mkdir($P, $M)
          - pattern: os.OpenFile($P, $F, $M)
          - pattern: ioutil.WriteFile($P, $D, $M)
      - metavariable-regex:
          metavariable: $M
          regex: ^0o?[0-7]{2}[67]$
    metadata:
      qualgate_id: go.permissive-file-mode
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: SF-03
      cwe: "CWE-732"
