rules:
  - id: go.weak-hash-md5
    languages: [go]
    severity: WARNING
    message: "[행안부 SF-04 취약한 암호화 알고리즘 사용] MD5는 충돌이 알려진 취약한 해시입니다. 무결성·서명 용도라면 SHA-256 이상을 쓰고 비밀번호는 bcrypt·argon2로 저장하세요."
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
    metadata:
      qualgate_id: go.weak-hash-md5
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: SF-04
      cwe: "CWE-328"
