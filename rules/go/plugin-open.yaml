rules:
  - id: go.plugin-open
    languages: [go]
    severity: INFO
    message: "[행안부 SF-15 무결성 검사 없는 코드 다운로드] plugin.Open으로 외부 공유 라이브러리를 실행 시점에 로드합니다. 파일이 변조되면 악성 코드가 프로세스 안에서 실행됩니다. 로드 전 해시·서명을 검증하고 쓰기 가능한 경로의 파일은 쓰지 마세요."
    patterns:
      - pattern: plugin.Open($X)
      - pattern-not: plugin.Open("...")
    metadata:
      qualgate_id: go.plugin-open
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: SF-15
      cwe: "CWE-494"
