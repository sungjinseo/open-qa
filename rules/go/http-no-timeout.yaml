rules:
  - id: go.http-no-timeout
    languages: [go]
    severity: WARNING
    message: "http.ListenAndServe는 타임아웃이 없어 느린 클라이언트로 연결이 고갈될 수 있습니다. 타임아웃을 지정한 http.Server를 사용하세요."
    pattern: |
      http.ListenAndServe(...)
    metadata:
      qualgate_id: go.http-no-timeout
      qualgate_severity: medium
      qualgate_category: reliability
