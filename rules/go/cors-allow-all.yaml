rules:
  - id: go.cors-allow-all
    languages: [go]
    severity: INFO
    message: "[행안부 확장 VC-03 과도하게 열린 CORS] CORS를 모든 출처(*)에 열었습니다. 인증이 필요한 API라면 다른 사이트의 스크립트가 사용자 권한으로 호출할 수 있습니다. 허용할 도메인을 명시하세요."
    pattern-either:
      - pattern: $W.Header().Set("Access-Control-Allow-Origin", "*")
      - pattern: $W.Header().Add("Access-Control-Allow-Origin", "*")
      - pattern: $C.Header("Access-Control-Allow-Origin", "*")
      - pattern: cors.AllowAll()
      - pattern: cors.Default()
      - pattern: 'cors.Options{..., AllowedOrigins: []string{"*"}, ...}'
      - pattern: 'cors.Config{..., AllowAllOrigins: true, ...}'
      - pattern: 'cors.Config{..., AllowOrigins: []string{"*"}, ...}'
    metadata:
      qualgate_id: go.cors-allow-all
      qualgate_severity: medium
      qualgate_category: security
      qualgate_kind: hotspot
      qualgate_mois: VC-03
      qualgate_owasp_api: ["API8:2023"]
      cwe: "CWE-942"
