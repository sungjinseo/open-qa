rules:
  - id: go.header-injection
    languages: [go]
    severity: INFO
    message: "[행안부 IV-13 HTTP 응답분할] 요청 값을 응답 헤더에 그대로 넣습니다. CR/LF가 섞이면 응답이 쪼개질 수 있습니다(Go 표준 서버는 일부 방어하지만 프록시·다른 프레임워크에서는 아닙니다). 줄바꿈 문자를 제거하거나 URL 인코딩하세요."
    mode: taint
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.Header.Get(...)
      - pattern: mux.Vars($R)
      - pattern: $C.Query(...)
      - pattern: $C.Param(...)
      - pattern: $C.QueryParam(...)
      - pattern: $C.PostForm(...)

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $W.Header().Set($K, $V)
              - pattern: $W.Header().Add($K, $V)
              - pattern: $C.Header($K, $V)
          - focus-metavariable: $V
    pattern-sanitizers:
      - pattern: url.QueryEscape(...)
    metadata:
      qualgate_id: go.header-injection
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: IV-13
      cwe: "CWE-113"
