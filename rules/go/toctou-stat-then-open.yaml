rules:
  - id: go.toctou-stat-then-open
    languages: [go]
    severity: INFO
    message: "[행안부 TS-01 경쟁조건: 검사시점과 사용시점(TOCTOU)] 파일 존재 여부를 확인한 뒤 같은 경로를 따로 엽니다. 확인과 사용 사이에 공격자가 파일을 바꿔치기(심볼릭 링크 등)할 수 있습니다. os.OpenFile에 O_EXCL 플래그를 주어 원자적으로 열고 오류를 처리하세요."
    pattern: |
      $X, $E := os.Stat($P)
      ...
      os.$F($P, ...)
    metadata:
      qualgate_id: go.toctou-stat-then-open
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: TS-01
      cwe: "CWE-367"
