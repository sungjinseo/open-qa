rules:
  - id: go.weak-hash-sha1
    languages: [go]
    severity: WARNING
    message: "[행안부 SF-04 취약한 암호화 알고리즘 사용] SHA-1은 충돌 공격이 실증된 해시입니다. SHA-256 이상을 쓰고 비밀번호는 bcrypt·argon2로 저장하세요."
    pattern-either:
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)
    metadata:
      qualgate_id: go.weak-hash-sha1
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: SF-04
      cwe: "CWE-328"
