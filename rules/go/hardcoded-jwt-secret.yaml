rules:
  - id: go.hardcoded-jwt-secret
    languages: [go]
    severity: ERROR
    message: "[행안부 SF-06 하드코드된 중요정보] JWT 서명 키가 코드에 문자열로 박혀 있습니다. 저장소를 볼 수 있는 누구나 토큰을 위조할 수 있습니다. 환경변수나 시크릿 저장소에서 읽고 노출된 키는 교체하세요."
    pattern-either:
      - pattern: $T.SignedString([]byte("..."))
      - patterns:
          - pattern: return []byte("..."), nil
          - pattern-either:
              - pattern-inside: |
                  func($TOK *jwt.Token) ($R, error) {
                      ...
                  }
              - pattern-inside: |
                  func $F($TOK *jwt.Token) ($R, error) {
                      ...
                  }
    metadata:
      qualgate_id: go.hardcoded-jwt-secret
      qualgate_severity: critical
      qualgate_category: security
      qualgate_mois: SF-06
      cwe: "CWE-798"
