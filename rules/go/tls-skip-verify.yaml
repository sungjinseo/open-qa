rules:
  - id: go.tls-skip-verify
    languages: [go]
    severity: ERROR
    message: "InsecureSkipVerify를 켜면 TLS 인증서 검증이 꺼져 중간자 공격에 노출됩니다. 검증을 유지하고 필요하면 RootCAs를 지정하세요."
    pattern: |
      tls.Config{..., InsecureSkipVerify: true, ...}
    metadata:
      qualgate_id: go.tls-skip-verify
      qualgate_severity: critical
      qualgate_category: security
