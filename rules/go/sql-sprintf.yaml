rules:
  - id: go.sql-sprintf
    languages: [go]
    severity: ERROR
    message: "fmt.Sprintf로 SQL을 만들면 SQL 인젝션 위험이 있습니다. ?나 $1 같은 파라미터 바인딩을 사용하세요."
    pattern: |
      $DB.Query(fmt.Sprintf(...), ...)
    metadata:
      qualgate_id: go.sql-sprintf
      qualgate_severity: high
      qualgate_category: security
