rules:
  - id: go.sql-sprintf
    languages: [go]
    severity: ERROR
    message: "[행안부 IV-01 SQL 삽입] fmt.Sprintf로 SQL을 만들어 실행합니다. 입력값이 쿼리 구조를 바꿔 데이터를 유출·변조할 수 있습니다. 플레이스홀더($1, ?)와 인자 바인딩을 사용하세요."
    pattern-either:
      - pattern: $DB.Query(fmt.Sprintf(...), ...)
      - pattern: $DB.QueryRow(fmt.Sprintf(...), ...)
      - pattern: $DB.Exec(fmt.Sprintf(...), ...)
      - pattern: $DB.QueryContext($CTX, fmt.Sprintf(...), ...)
      - pattern: $DB.ExecContext($CTX, fmt.Sprintf(...), ...)
    metadata:
      qualgate_id: go.sql-sprintf
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: IV-01
      cwe: "CWE-89"
