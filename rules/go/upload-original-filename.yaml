rules:
  - id: go.upload-original-filename
    languages: [go]
    severity: WARNING
    message: "[행안부 IV-06 위험한 형식 파일 업로드] 업로드된 파일의 원본 이름을 검증 없이 저장 경로에 씁니다. 실행 가능한 확장자를 올리거나 ../ 로 임의 위치에 쓸 수 있습니다. 확장자 허용 목록을 확인하고 저장 이름은 서버가 새로 만드세요."
    pattern-either:
      - pattern: os.Create(<... $H.Filename ...>)
      - pattern: os.OpenFile(<... $H.Filename ...>, ...)
      - pattern: $C.SaveUploadedFile($H, <... $H.Filename ...>)
    metadata:
      qualgate_id: go.upload-original-filename
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: IV-06
      cwe: "CWE-434"
