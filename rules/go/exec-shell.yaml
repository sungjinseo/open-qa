rules:
  - id: go.exec-shell
    languages: [go]
    severity: ERROR
    message: "[행안부 IV-05 운영체제 명령어 삽입] 셸(sh -c, bash -c, cmd /c)로 명령 문자열을 실행합니다. 외부 값이 섞이면 ; 나 && 로 임의 명령이 실행됩니다. exec.Command(\"prog\", args...)로 인자를 분리하고 인자는 허용 목록으로 검증하세요."
    pattern-either:
      - pattern: exec.Command("sh", "-c", ...)
      - pattern: exec.Command("bash", "-c", ...)
      - pattern: exec.Command("cmd", "/c", ...)
      - pattern: exec.CommandContext($CTX, "sh", "-c", ...)
      - pattern: exec.CommandContext($CTX, "bash", "-c", ...)
    metadata:
      qualgate_id: go.exec-shell
      qualgate_severity: critical
      qualgate_category: security
      qualgate_mois: IV-05
      cwe: "CWE-78"
