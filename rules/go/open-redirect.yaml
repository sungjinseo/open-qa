rules:
  - id: go.open-redirect
    languages: [go]
    severity: WARNING
    message: "[행안부 IV-07 신뢰되지 않은 URL주소로 자동접속 연결] 요청 값을 그대로 리다이렉트 주소로 씁니다. 정상 사이트 링크를 통해 사용자를 피싱 사이트로 보낼 수 있습니다. 허용 경로 목록과 비교하거나 / 로 시작하는 내부 경로만 허용하세요."
    mode: taint
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.Header.Get(...)
      - pattern: mux.Vars($R)
      - pattern: $C.Query(...)
      - pattern: $C.Param(...)
      - pattern: $C.QueryParam(...)
      - pattern: $C.PostForm(...)

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: http.Redirect($W, $RQ, $U, ...)
              - pattern: $C.Redirect($CODE, $U)
          - focus-metavariable: $U
    pattern-sanitizers:
      - pattern: safeRedirectTarget(...)
    metadata:
      qualgate_id: go.open-redirect
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: IV-07
      cwe: "CWE-601"
