rules:
  - id: go.error-message-response
    languages: [go]
    severity: WARNING
    message: "[행안부 EH-01 오류 메시지 정보노출] err.Error() 내용을 HTTP 응답으로 돌려줍니다. 쿼리문·경로·라이브러리 정보 같은 내부 정보가 노출됩니다. 상세 오류는 서버 로그에만 남기고 응답에는 일반 오류 메시지를 쓰세요."
    pattern-either:
      - pattern: http.Error($W, $E.Error(), ...)
      - pattern: $W.Write([]byte($E.Error()))
      - pattern: '$C.JSON($CODE, gin.H{..., $K: $E.Error(), ...})'
    metadata:
      qualgate_id: go.error-message-response
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: EH-01
      cwe: "CWE-209"
