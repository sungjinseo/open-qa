rules:
  - id: go.ssrf
    languages: [go]
    severity: ERROR
    message: "[행안부 IV-12 서버사이드 요청 위조] 요청 값을 그대로 서버가 보내는 요청의 주소로 씁니다. 클라우드 메타데이터(169.254.169.254)나 내부 서비스로 요청이 나갈 수 있습니다. 호스트를 허용 목록과 비교하고 사설 IP 대역을 차단하세요."
    mode: taint
    pattern-sources:
      - pattern: $R.URL.Query().Get(...)
      - pattern: $R.FormValue(...)
      - pattern: $R.PostFormValue(...)
      - pattern: $R.Header.Get(...)
      - pattern: mux.Vars($R)
      - pattern: $C.Query(...)
      - pattern: $C.Param(...)
      - pattern: $C.QueryParam(...)
      - pattern: $C.PostForm(...)

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: http.Get($U)
              - pattern: http.Post($U, ...)
              - pattern: http.NewRequest($M, $U, ...)
              - pattern: http.NewRequestWithContext($C, $M, $U, ...)
              - pattern: http.Head($U)
              - pattern: http.DefaultClient.Get($U)
              - pattern: ($CL *http.Client).Get($U)
          - focus-metavariable: $U
    pattern-sanitizers:
      - pattern: assertAllowedHost(...)
    metadata:
      qualgate_id: go.ssrf
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: IV-12
      cwe: "CWE-918"
