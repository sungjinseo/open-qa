rules:
  - id: go.int-overflow
    languages: [go]
    severity: INFO
    message: "[행안부 IV-14 정수형 오버플로우] strconv.Atoi로 읽은 int를 int32·uint8·uint16 같은 더 작은 정수형으로 범위 검사 없이 변환합니다. 값이 크면 잘려서(오버플로우) 의도와 다른 값이 됩니다. strconv.ParseUint(s, 10, 16)처럼 비트 크기를 지정하거나 변환 전에 범위를 검증하세요."
    pattern-either:
      - pattern: |
          $N, $E := strconv.Atoi($S)
          ...
          int32($N)
      - pattern: |
          $N, $E := strconv.Atoi($S)
          ...
          uint8($N)
      - pattern: |
          $N, $E := strconv.Atoi($S)
          ...
          uint16($N)
    metadata:
      qualgate_id: go.int-overflow
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: IV-14
      cwe: "CWE-190"
