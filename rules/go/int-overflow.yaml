rules:
  - id: go.int-overflow
    languages: [go]
    severity: INFO
    message: "[행안부 IV-14 정수형 오버플로우] 정수 곱셈 결과를 할당 크기로 쓰거나 int를 더 작은 정수형으로 변환합니다. 값이 클 때 오버플로우로 음수·작은 값이 되어 버퍼가 잘못 만들어집니다. 범위를 먼저 검증하고 math/bits·math.MaxInt32 비교를 쓰세요."
    pattern-either:
      - pattern: |
          $N, $E := strconv.Atoi($S)
          ...
          int32($N)
      - pattern: |
          $N, $E := strconv.Atoi($S)
          ...
          uint8($N)
      - pattern: |
          $N, $E := strconv.Atoi($S)
          ...
          uint16($N)
    metadata:
      qualgate_id: go.int-overflow
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: IV-14
      cwe: "CWE-190"
