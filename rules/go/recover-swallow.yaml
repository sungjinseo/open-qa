rules:
  - id: go.recover-swallow
    languages: [go]
    severity: INFO
    message: "[행안부 EH-03 부적절한 예외 처리] recover()의 결과를 사용하지 않아 panic을 조용히 삼킵니다. 서로 다른 오류가 구분 없이 사라져 장애 원인을 알 수 없습니다. 값을 로깅하고 복구 가능한 경우에만 재개하세요."
    pattern-either:
      - pattern: |
          defer func() {
              recover()
          }()
    metadata:
      qualgate_id: go.recover-swallow
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: EH-03
      cwe: "CWE-396"
