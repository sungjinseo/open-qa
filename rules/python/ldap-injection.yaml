rules:
  - id: python.ldap-injection
    languages: [python]
    severity: ERROR
    message: "[행안부 IV-10 LDAP 삽입] LDAP 검색 필터를 입력값이 섞인 문자열로 만듭니다. 필터를 조작해 다른 계정을 조회하거나 인증을 우회할 수 있습니다. ldap3.utils.conv.escape_filter_chars()로 입력값을 이스케이프하세요."
    pattern-either:
      - pattern: $C.search_s($B, $S, f"...", ...)
      - pattern: $C.search_s($B, $S, "..." + $X, ...)
      - pattern: $C.search_s($B, $S, "...".format(...), ...)
      - pattern: $C.search($B, f"...", ...)
      - pattern: $C.search($B, "..." + $X, ...)
    metadata:
      qualgate_id: python.ldap-injection
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: IV-10
      cwe: "CWE-90"
