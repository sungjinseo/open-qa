rules:
  - id: python.toctou-exists-then-open
    languages: [python]
    severity: INFO
    message: "[행안부 TS-01 경쟁조건: 검사시점과 사용시점(TOCTOU)] 파일 존재 여부를 확인한 뒤 같은 경로를 따로 엽니다. 확인과 사용 사이에 공격자가 파일을 바꿔치기(심볼릭 링크 등)할 수 있습니다. 바로 열고 예외를 처리하거나 open(path, \"x\") 같은 원자적 연산을 쓰세요."
    patterns:
      - pattern-either:
          - pattern-inside: |
              if os.path.exists($P):
                  ...
          - pattern-inside: |
              if not os.path.exists($P):
                  ...
          - pattern-inside: |
              if os.access($P, ...):
                  ...
      - pattern: open($P, ...)
    metadata:
      qualgate_id: python.toctou-exists-then-open
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: TS-01
      cwe: "CWE-367"
