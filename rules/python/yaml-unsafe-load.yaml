rules:
  - id: python.yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: "[행안부 CE-05 신뢰할 수 없는 데이터의 역직렬화] yaml.load를 안전하지 않은 Loader로 호출하면 YAML 안의 파이썬 객체 생성 구문이 실행됩니다. yaml.safe_load를 쓰세요."
    pattern-either:
      - patterns:
          - pattern: yaml.load($X)
      - pattern: yaml.load($X, Loader=yaml.Loader)
      - pattern: yaml.load($X, Loader=yaml.UnsafeLoader)
      - pattern: yaml.unsafe_load(...)
    metadata:
      qualgate_id: python.yaml-unsafe-load
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: CE-05
      cwe: "CWE-502"
