rules:
  - id: python.weak-hash-sha1
    languages: [python]
    severity: WARNING
    message: "SHA-1은 충돌 공격이 실증되어 보안 용도로 부적합합니다. hashlib.sha256 이상을 사용하세요."
    pattern: |
      hashlib.sha1(...)
    metadata:
      qualgate_id: python.weak-hash-sha1
      qualgate_severity: medium
      qualgate_category: security
