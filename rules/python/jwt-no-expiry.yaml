rules:
  - id: python.jwt-no-expiry
    languages: [python]
    severity: WARNING
    message: "[행안부 확장 VC-07 만료 없는 인증 토큰] JWT를 만료 시간(exp) 없이 발급합니다. 토큰이 유출되면 영구히 쓸 수 있습니다. 페이로드에 \"exp\"를 넣어 짧게 만료시키세요."
    patterns:
      - pattern: jwt.encode({...}, ...)
      - pattern-not: 'jwt.encode({..., "exp": $E, ...}, ...)'
    metadata:
      qualgate_id: python.jwt-no-expiry
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: VC-07
      qualgate_owasp_api: ["API2:2023"]
      cwe: "CWE-613"
