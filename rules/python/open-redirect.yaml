rules:
  - id: python.open-redirect
    languages: [python]
    severity: WARNING
    message: "[행안부 IV-07 신뢰되지 않은 URL주소로 자동접속 연결] 요청 값을 그대로 리다이렉트 주소로 씁니다. 정상 사이트 링크를 통해 사용자를 피싱 사이트로 보낼 수 있습니다. url_has_allowed_host_and_scheme()로 검사하거나 허용 경로 목록과 비교하세요."
    mode: taint
    pattern-sources:
      - pattern: request.args
      - pattern: request.form
      - pattern: request.values
      - pattern: request.json
      - pattern: request.get_json(...)
      - pattern: request.cookies
      - pattern: request.headers
      - pattern: request.GET
      - pattern: request.POST
      - pattern: request.data
      - pattern: request.body

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: redirect($U, ...)
              - pattern: HttpResponseRedirect($U)
          - focus-metavariable: $U
    pattern-sanitizers:
      - pattern: url_for(...)
      - pattern: url_has_allowed_host_and_scheme(...)
    metadata:
      qualgate_id: python.open-redirect
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: IV-07
      cwe: "CWE-601"
