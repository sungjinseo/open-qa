rules:
  - id: python.eval
    languages: [python]
    severity: ERROR
    message: "eval은 문자열을 코드로 실행해 임의 코드 실행 위험이 있습니다. ast.literal_eval이나 명시적 파서를 사용하세요."
    pattern: |
      eval(...)
    metadata:
      qualgate_id: python.eval
      qualgate_severity: critical
      qualgate_category: security
