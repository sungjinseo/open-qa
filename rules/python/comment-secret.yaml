rules:
  - id: python.comment-secret
    languages: [python]
    severity: INFO
    message: "[행안부 SF-13 주석문 안에 포함된 시스템 주요정보] 주석에 비밀번호·키·토큰으로 보이는 값이 적혀 있습니다. 소스를 볼 수 있는 모든 사람에게 노출됩니다. 주석에서 지우고 이미 쓰인 값은 교체하세요."
    pattern-regex: '#.*(password|passwd|pwd|secret|token|api[_-]?key)\s*[:=]\s*\S{4,}'
    metadata:
      qualgate_id: python.comment-secret
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: SF-13
      cwe: "CWE-615"
