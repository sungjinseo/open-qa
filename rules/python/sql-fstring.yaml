rules:
  - id: python.sql-fstring
    languages: [python]
    severity: ERROR
    message: "f-string으로 SQL을 만들면 SQL 인젝션 위험이 있습니다. 쿼리 파라미터 바인딩을 사용하세요."
    pattern: |
      $C.execute(f"...")
    metadata:
      qualgate_id: python.sql-fstring
      qualgate_severity: high
      qualgate_category: security
