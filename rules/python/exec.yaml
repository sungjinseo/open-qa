rules:
  - id: python.exec
    languages: [python]
    severity: ERROR
    message: "[행안부 IV-02 코드 삽입] exec()은 문자열을 파이썬 코드로 실행합니다. 외부 값이 섞이면 서버에서 임의 코드가 실행됩니다. 실행할 동작을 미리 정의한 함수 목록에서 고르는 방식으로 바꾸세요."
    patterns:
      - pattern: exec($X, ...)
      - pattern-not: exec("...", ...)
    metadata:
      qualgate_id: python.exec
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: IV-02
      cwe: "CWE-95"
