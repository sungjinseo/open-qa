rules:
  - id: python.csrf-disabled
    languages: [python]
    severity: WARNING
    message: "[행안부 IV-11 크로스사이트 요청 위조] CSRF 방어를 끈 설정입니다(csrf_exempt, WTF_CSRF_ENABLED=False). 로그인한 사용자의 브라우저로 공격자가 상태 변경 요청을 보낼 수 있습니다. CSRF 토큰을 유지하고 토큰 기반 API라면 근거를 남기세요."
    pattern-either:
      - pattern: |
          @csrf_exempt
          def $F(...):
              ...
      - pattern: $A.config["WTF_CSRF_ENABLED"] = False
      - pattern: WTF_CSRF_ENABLED = False
    metadata:
      qualgate_id: python.csrf-disabled
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: IV-11
      cwe: "CWE-352"
