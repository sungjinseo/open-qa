rules:
  - id: python.debug-breakpoint
    languages: [python]
    severity: INFO
    message: "[행안부 EN-02 제거되지 않고 남은 디버그 코드] 디버거 호출(pdb.set_trace, breakpoint)이 남아 있습니다. 운영 환경에서 프로세스가 멈추거나 내부 상태가 노출됩니다. 배포 전에 제거하세요."
    pattern-either:
      - pattern: pdb.set_trace()
      - pattern: breakpoint()
      - pattern: ipdb.set_trace()
    metadata:
      qualgate_id: python.debug-breakpoint
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: EN-02
      cwe: "CWE-489"
