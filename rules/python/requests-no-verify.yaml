rules:
  - id: python.requests-no-verify
    languages: [python]
    severity: ERROR
    message: "verify=False는 TLS 인증서 검증을 끄므로 중간자 공격에 노출됩니다. 검증을 켜고 필요하면 CA 번들을 지정하세요."
    pattern: |
      requests.$F(..., verify=False, ...)
    metadata:
      qualgate_id: python.requests-no-verify
      qualgate_severity: high
      qualgate_category: security
