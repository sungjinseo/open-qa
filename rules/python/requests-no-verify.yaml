rules:
  - id: python.requests-no-verify
    languages: [python]
    severity: ERROR
    message: "[행안부 SF-11 부적절한 인증서 유효성 검증] verify=False로 TLS 인증서 검증을 껐습니다. 중간자 공격으로 통신 내용이 노출·변조됩니다. 검증을 켜고 사설 CA라면 verify=\"ca.pem\"으로 지정하세요."
    pattern-either:
      - pattern: requests.$F(..., verify=False, ...)
      - pattern: httpx.$F(..., verify=False, ...)
      - pattern: $S.verify = False
    metadata:
      qualgate_id: python.requests-no-verify
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: SF-11
      cwe: "CWE-295"
