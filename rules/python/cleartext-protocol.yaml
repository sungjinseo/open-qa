rules:
  - id: python.cleartext-protocol
    languages: [python]
    severity: INFO
    message: "[행안부 SF-05 암호화되지 않은 중요정보] FTP·Telnet 같은 평문 프로토콜이나 http:// 주소로 통신합니다. 계정 정보와 데이터가 전송 중 그대로 노출됩니다. SFTP·SSH·HTTPS 같은 암호화 프로토콜을 쓰세요."
    pattern-either:
      - pattern: ftplib.FTP(...)
      - pattern: telnetlib.Telnet(...)
      - patterns:
          - pattern: requests.$M("...", ...)
          - pattern-regex: requests\.\w+\(\s*["']http://(?!localhost|127\.0\.0\.1)
    metadata:
      qualgate_id: python.cleartext-protocol
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: SF-05
      cwe: "CWE-319"
