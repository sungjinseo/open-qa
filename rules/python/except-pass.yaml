rules:
  - id: python.except-pass
    languages: [python]
    severity: INFO
    message: "[행안부 EH-02 오류상황 대응 부재] 예외를 잡고 아무 처리도 하지 않습니다(except: pass). 인증·결제 같은 실패가 조용히 무시됩니다. 로깅·복구·상위 전파 등 적절히 대응하세요."
    pattern-either:
      - pattern: |
          try:
              ...
          except $E:
              pass
      - pattern: |
          try:
              ...
          except $E as $V:
              pass
    metadata:
      qualgate_id: python.except-pass
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: EH-02
      cwe: "CWE-390"
