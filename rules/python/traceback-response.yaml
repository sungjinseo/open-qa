rules:
  - id: python.traceback-response
    languages: [python]
    severity: WARNING
    message: "[행안부 EH-01 오류 메시지 정보노출] 트레이스백이나 예외 객체를 HTTP 응답으로 돌려줍니다. 파일 경로·쿼리·라이브러리 버전 같은 내부 정보가 노출됩니다. 상세 오류는 서버 로그에만 남기고 응답에는 일반 오류 메시지를 쓰세요."
    pattern-either:
      - pattern: return traceback.format_exc()
      - patterns:
          - pattern: $F(..., traceback.format_exc(), ...)
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^(?!.*(log|print|warn)).*$
      - pattern: |
          try:
              ...
          except $T as $E:
              ...
              return str($E)
      - pattern: |
          try:
              ...
          except $T as $E:
              ...
              return jsonify(..., str($E), ...)
    metadata:
      qualgate_id: python.traceback-response
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: EH-01
      cwe: "CWE-209"
