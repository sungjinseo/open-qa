rules:
  - id: python.weak-hash-md5
    languages: [python]
    severity: WARNING
    message: "MD5는 충돌 공격에 취약해 보안 용도로 부적합합니다. hashlib.sha256 이상을 사용하세요."
    pattern: |
      hashlib.md5(...)
    metadata:
      qualgate_id: python.weak-hash-md5
      qualgate_severity: medium
      qualgate_category: security
