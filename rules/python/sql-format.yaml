rules:
  - id: python.sql-format
    languages: [python]
    severity: ERROR
    message: "[행안부 IV-01 SQL 삽입] .format()이나 % 연산자로 SQL을 만들어 실행합니다. 입력값이 쿼리 구조를 바꿔 데이터를 유출·변조할 수 있습니다. 쿼리 파라미터 바인딩을 사용하세요."
    pattern-either:
      - pattern: $C.execute("...".format(...), ...)
      - pattern: $C.execute("..." % $X, ...)
      - pattern: $C.execute("..." + $X, ...)
      - pattern: $C.execute($X + "...", ...)
    metadata:
      qualgate_id: python.sql-format
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: IV-01
      cwe: "CWE-89"
