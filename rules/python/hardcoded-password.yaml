rules:
  - id: python.hardcoded-password
    languages: [python]
    severity: ERROR
    message: "[행안부 SF-06 하드코드된 중요정보] 비밀번호·API 키로 보이는 값이 소스에 문자열로 박혀 있습니다. 저장소를 볼 수 있는 누구나 사용할 수 있고 교체도 어렵습니다. 환경변수나 시크릿 저장소에서 읽으세요."
    patterns:
      - pattern: $P = "$S"
      - metavariable-regex:
          metavariable: $P
          regex: (?i).*(passw|pwd|secret|api_?key|token).*
      - metavariable-regex:
          metavariable: $S
          regex: ^(?![A-Z][A-Z0-9_]*$)(?=.{8,}$)(?=.*[^A-Za-z])(?!.*\s).*$
    metadata:
      qualgate_id: python.hardcoded-password
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: SF-06
      cwe: "CWE-798"
