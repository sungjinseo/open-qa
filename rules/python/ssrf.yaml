rules:
  - id: python.ssrf
    languages: [python]
    severity: ERROR
    message: "[행안부 IV-12 서버사이드 요청 위조] 요청 값을 그대로 서버가 보내는 요청의 주소로 씁니다. 클라우드 메타데이터(169.254.169.254)나 내부 서비스로 요청이 나갈 수 있습니다. 호스트를 허용 목록과 비교하고 사설 IP 대역을 차단하세요."
    mode: taint
    pattern-sources:
      - pattern: request.args
      - pattern: request.form
      - pattern: request.values
      - pattern: request.json
      - pattern: request.get_json(...)
      - pattern: request.cookies
      - pattern: request.headers
      - pattern: request.GET
      - pattern: request.POST
      - pattern: request.data
      - pattern: request.body

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.$M($U, ...)
              - pattern: httpx.$M($U, ...)
              - pattern: urllib.request.urlopen($U, ...)
              - pattern: urlopen($U, ...)
          - focus-metavariable: $U
    pattern-sanitizers:
      - pattern: assert_allowed_host(...)
    metadata:
      qualgate_id: python.ssrf
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: IV-12
      cwe: "CWE-918"
