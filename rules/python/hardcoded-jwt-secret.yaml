rules:
  - id: python.hardcoded-jwt-secret
    languages: [python]
    severity: ERROR
    message: "[행안부 SF-06 하드코드된 중요정보] JWT 서명 비밀키나 Flask secret_key가 코드에 박혀 있습니다. 저장소를 볼 수 있는 누구나 토큰·세션을 위조할 수 있습니다. 환경변수나 시크릿 저장소로 옮기고 노출된 키는 교체하세요."
    pattern-either:
      - pattern: jwt.encode($P, "...", ...)
      - pattern: jwt.decode($T, "...", ...)
      - pattern: $A.secret_key = "..."
      - pattern: $A.config["SECRET_KEY"] = "..."
    metadata:
      qualgate_id: python.hardcoded-jwt-secret
      qualgate_severity: critical
      qualgate_category: security
      qualgate_mois: SF-06
      cwe: "CWE-798"
