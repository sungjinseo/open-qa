rules:
  - id: java.weak-hash-sha1
    languages: [java]
    severity: WARNING
    message: "SHA-1은 충돌 공격이 실증되어 보안 용도로 부적합합니다. SHA-256 이상을 사용하세요."
    pattern: |
      MessageDigest.getInstance("SHA-1")
    metadata:
      qualgate_id: java.weak-hash-sha1
      qualgate_severity: medium
      qualgate_category: security
