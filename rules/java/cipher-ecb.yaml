rules:
  - id: java.cipher-ecb
    languages: [java]
    severity: ERROR
    message: "[행안부 SF-04 취약한 암호화 알고리즘 사용] ECB 모드(또는 모드를 생략한 AES)를 씁니다. 같은 평문 블록이 같은 암호문이 되어 패턴이 노출됩니다. AES/GCM/NoPadding 같은 인증 암호화 모드를 쓰세요."
    patterns:
      - pattern: Cipher.getInstance($A, ...)
      - metavariable-regex:
          metavariable: $A
          regex: (?i)^"(aes|[a-z0-9]+/ecb/.*)"$
    metadata:
      qualgate_id: java.cipher-ecb
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: SF-04
      cwe: "CWE-327"
