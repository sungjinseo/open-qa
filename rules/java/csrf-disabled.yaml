rules:
  - id: java.csrf-disabled
    languages: [java]
    severity: WARNING
    message: "[행안부 IV-11 크로스사이트 요청 위조] Spring Security의 CSRF 방어를 껐습니다. 로그인한 사용자의 브라우저로 공격자가 상태 변경 요청을 보낼 수 있습니다. CSRF 토큰을 유지하고, 토큰 기반 무상태 API라면 근거를 주석으로 남기세요."
    pattern-either:
      - pattern: $H.csrf().disable()
      - pattern: $H.csrf(AbstractHttpConfigurer::disable)
      - pattern: $H.csrf($C -> $C.disable())
    metadata:
      qualgate_id: java.csrf-disabled
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: IV-11
      cwe: "CWE-352"
