rules:
  - id: java.cipher-des
    languages: [java]
    severity: ERROR
    message: "[행안부 SF-04 취약한 암호화 알고리즘 사용] DES·3DES·RC4·Blowfish 같은 취약한 암호 알고리즘을 씁니다. 키 길이가 짧거나 알려진 공격이 있어 해독될 수 있습니다. AES-256-GCM을 쓰세요."
    patterns:
      - pattern: Cipher.getInstance($A, ...)
      - metavariable-regex:
          metavariable: $A
          regex: (?i)^"(des|desede|3des|rc4|rc2|blowfish|arcfour)(/.*)?"$
    metadata:
      qualgate_id: java.cipher-des
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: SF-04
      cwe: "CWE-327"
