rules:
  - id: java.throws-generic-exception
    languages: [java]
    severity: INFO
    message: "[행안부 EH-03 부적절한 예외 처리] 메서드가 throws Exception으로 모든 예외를 위임합니다. 호출자가 어떤 오류를 처리해야 하는지 알 수 없어 부적절한 예외 처리로 이어집니다. 구체적인 예외 타입을 선언하세요. (main, 테스트 메서드, Spring configure는 제외합니다.)"
    patterns:
      - pattern-either:
          - pattern: |
              $T $M(...) throws Exception {...}
          - pattern: |
              $T $M(...) throws Throwable {...}
      - pattern-not: |
          void main(String[] $A) throws Exception {...}
      - pattern-not: |
          void configure(HttpSecurity $H) throws Exception {...}
      - pattern-not: |
          @Test
          $T $M(...) throws Exception {...}
      - pattern-not: |
          @BeforeEach
          $T $M(...) throws Exception {...}
      - pattern-not: |
          @AfterEach
          $T $M(...) throws Exception {...}
      - pattern-not: |
          @Bean
          $T $M(...) throws Exception {...}
    metadata:
      qualgate_id: java.throws-generic-exception
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: EH-03
      cwe: "CWE-397"
