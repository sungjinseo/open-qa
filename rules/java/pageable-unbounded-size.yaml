rules:
  - id: java.pageable-unbounded-size
    languages: [java]
    severity: WARNING
    message: "[행안부 확장 VC-06 자원 사용 제한 부재] 요청 파라미터로 받은 페이지 크기를 상한 없이 조회에 씁니다. size=1000000 같은 요청 한 번으로 DB와 메모리가 고갈될 수 있습니다. Math.min으로 상한을 두거나 spring.data.web.pageable.max-page-size를 설정하세요."
    patterns:
      - pattern-either:
          - pattern-inside: |
              $R $M(..., @RequestParam $T $S, ...) { ... }
          - pattern-inside: |
              $R $M(..., @RequestParam(...) $T $S, ...) { ... }
      - pattern-either:
          - pattern: PageRequest.of($P, $S, ...)
          - pattern: $Q.setMaxResults($S)
    metadata:
      qualgate_id: java.pageable-unbounded-size
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: VC-06
      qualgate_owasp_api: ["API4:2023"]
      cwe: "CWE-770"
