rules:
  - id: java.random-for-security
    languages: [java]
    severity: WARNING
    message: "[행안부 SF-08 적절하지 않은 난수 값 사용] java.util.Random·Math.random()은 예측 가능한 난수입니다. 토큰·인증번호·비밀번호 생성에 쓰면 값이 추측됩니다. java.security.SecureRandom을 쓰세요."
    pattern-either:
      - pattern: new java.util.Random(...)
      - pattern: new Random(...)
      - pattern: Math.random()
    metadata:
      qualgate_id: java.random-for-security
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: SF-08
      cwe: "CWE-330"
