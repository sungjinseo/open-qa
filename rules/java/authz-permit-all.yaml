rules:
  - id: java.authz-permit-all
    languages: [java]
    severity: WARNING
    message: "[행안부 SF-01 적절한 인증 없는 중요 기능 허용] Spring Security에서 관리·내부 경로나 모든 요청을 인증 없이 허용합니다(permitAll). 로그인 없이 중요 기능이 호출될 수 있습니다. 공개 경로만 permitAll로 두고 나머지는 authenticated()·hasRole()로 보호하세요."
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $A.antMatchers($P, ...).permitAll()
              - pattern: $A.requestMatchers($P, ...).permitAll()
          - metavariable-regex:
              metavariable: $P
              regex: ^"/(admin|manage|internal)
      - pattern: $A.anyRequest().permitAll()
    metadata:
      qualgate_id: java.authz-permit-all
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: SF-01
      cwe: "CWE-306"
