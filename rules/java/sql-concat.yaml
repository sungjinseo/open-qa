rules:
  - id: java.sql-concat
    languages: [java]
    severity: ERROR
    message: "SQL을 문자열 연결로 만들면 SQL 인젝션 위험이 있습니다. PreparedStatement의 파라미터 바인딩을 사용하세요."
    pattern: |
      $S.executeQuery("..." + $X)
    metadata:
      qualgate_id: java.sql-concat
      qualgate_severity: high
      qualgate_category: security
