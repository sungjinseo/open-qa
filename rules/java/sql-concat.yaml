rules:
  - id: java.sql-concat
    languages: [java]
    severity: ERROR
    message: "[행안부 IV-01 SQL 삽입] SQL을 문자열 연결로 만들어 실행합니다. 입력값이 쿼리 구조를 바꿔 데이터를 유출·변조할 수 있습니다. PreparedStatement의 파라미터 바인딩이나 JPA의 setParameter를 사용하세요. (MyBatis XML의 ${} 는 코드만으로 볼 수 없어 이 규칙이 잡지 못합니다.)"
    pattern-either:
      - pattern: $S.executeQuery("..." + $X)
      - pattern: $S.executeQuery($A + $B)
      - pattern: $C.prepareStatement("..." + $X)
      - pattern: $C.prepareStatement($A + $B)
      - pattern: $EM.createQuery("..." + $X, ...)
      - pattern: $EM.createNativeQuery("..." + $X, ...)
      - pattern: $T.queryForObject("..." + $X, ...)
      - pattern: $T.query("..." + $X, ...)
    metadata:
      qualgate_id: java.sql-concat
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: IV-01
      cwe: "CWE-89"
