rules:
  - id: java.sql-update-concat
    languages: [java]
    severity: ERROR
    message: "[행안부 IV-01 SQL 삽입] UPDATE/DELETE/INSERT 문을 문자열 연결로 만들어 실행합니다. 입력값으로 조건이 바뀌어 다른 행까지 변경·삭제될 수 있습니다. PreparedStatement의 파라미터 바인딩을 사용하세요."
    patterns:
      - pattern-either:
          - pattern: $S.executeUpdate($A + $B)
          - pattern: $S.execute($A + $B)
          - pattern: $S.addBatch($A + $B)
      - pattern-not: $S.$M("..." + "...")
    metadata:
      qualgate_id: java.sql-update-concat
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: IV-01
      cwe: "CWE-89"
