rules:
  - id: java.open-redirect
    languages: [java]
    severity: WARNING
    message: "[행안부 IV-07 신뢰되지 않은 URL주소로 자동접속 연결] 요청 값을 그대로 리다이렉트 주소로 씁니다. 정상 사이트 링크를 통해 사용자를 피싱 사이트로 보낼 수 있습니다. 이동 가능한 경로를 허용 목록과 비교하거나 / 로 시작하는 내부 경로만 허용하세요."
    mode: taint
    pattern-sources:
      - pattern: (HttpServletRequest $R).getParameter(...)
      - pattern: (HttpServletRequest $R).getHeader(...)
      - pattern: (HttpServletRequest $R).getQueryString()
      - patterns:
          - pattern-inside: |
              $RET $M(..., @RequestParam $T $X, ...) {...}
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., @PathVariable $T $X, ...) {...}
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., @RequestBody $T $X, ...) {...}
          - focus-metavariable: $X

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RESP.sendRedirect($U)
              - pattern: new RedirectView($U)
              - pattern: '"redirect:" + $U'
          - focus-metavariable: $U
    pattern-sanitizers:
      - pattern: safeRedirectTarget(...)
    metadata:
      qualgate_id: java.open-redirect
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: IV-07
      cwe: "CWE-601"
