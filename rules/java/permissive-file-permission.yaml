rules:
  - id: java.permissive-file-permission
    languages: [java]
    severity: WARNING
    message: "[행안부 SF-03 중요한 자원에 대한 잘못된 권한 설정] 파일을 모든 사용자가 읽고 쓸 수 있게 권한을 설정합니다. 다른 계정이 설정·키·업로드 파일을 열람하거나 변조할 수 있습니다. 소유자 권한(rw-------, rwxr-x---)만 부여하세요."
    pattern-either:
      - pattern: $F.setWritable(true, false)
      - pattern: $F.setReadable(true, false)
      - pattern: $F.setExecutable(true, false)
      - pattern: PosixFilePermissions.fromString("rwxrwxrwx")
      - pattern: PosixFilePermissions.fromString("rw-rw-rw-")
    metadata:
      qualgate_id: java.permissive-file-permission
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: SF-03
      cwe: "CWE-732"
