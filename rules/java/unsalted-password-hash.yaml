rules:
  - id: java.unsalted-password-hash
    languages: [java]
    severity: ERROR
    message: "[행안부 SF-14 솔트 없이 일방향 해쉬 함수 사용] 비밀번호를 솔트 없이 MessageDigest로 해시합니다. 레인보우 테이블로 바로 복원됩니다. BCryptPasswordEncoder·PBKDF2·argon2처럼 솔트와 반복 비용이 있는 함수를 쓰세요."
    patterns:
      - pattern: $MD.digest($PW.getBytes(...))
      - metavariable-regex:
          metavariable: $PW
          regex: (?i).*(password|passwd|pwd).*
    metadata:
      qualgate_id: java.unsalted-password-hash
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: SF-14
      cwe: "CWE-759"
