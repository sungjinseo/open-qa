rules:
  - id: java.ssrf
    languages: [java]
    severity: ERROR
    message: "[행안부 IV-12 서버사이드 요청 위조] 요청 값을 그대로 서버가 보내는 요청의 주소로 씁니다. 클라우드 메타데이터(169.254.169.254)나 내부 서비스로 요청이 나갈 수 있습니다. 호스트를 허용 목록과 비교하고 사설 IP 대역을 차단하세요."
    mode: taint
    pattern-sources:
      - pattern: (HttpServletRequest $R).getParameter(...)
      - pattern: (HttpServletRequest $R).getHeader(...)
      - pattern: (HttpServletRequest $R).getQueryString()
      - patterns:
          - pattern-inside: |
              $RET $M(..., @RequestParam $T $X, ...) {...}
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., @PathVariable $T $X, ...) {...}
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., @RequestBody $T $X, ...) {...}
          - focus-metavariable: $X

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new URL($U)
              - pattern: URI.create($U)
              - pattern: new URI($U)
              - pattern: $RT.getForObject($U, ...)
              - pattern: $RT.getForEntity($U, ...)
          - focus-metavariable: $U
    metadata:
      qualgate_id: java.ssrf
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: IV-12
      cwe: "CWE-918"
