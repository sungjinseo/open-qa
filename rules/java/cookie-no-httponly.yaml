rules:
  - id: java.cookie-no-httponly
    languages: [java]
    severity: INFO
    message: "[행안부 SF-12 쿠키를 통한 정보노출] 쿠키를 만들고 HttpOnly를 설정하지 않았습니다. 스크립트(XSS)로 쿠키 값을 읽어 세션을 탈취할 수 있습니다. setHttpOnly(true)를 호출하세요."
    patterns:
      - pattern: Cookie $C = new Cookie(...);
      - pattern-not-inside: |
          Cookie $C = new Cookie(...);
          ...
          $C.setHttpOnly(true);
    metadata:
      qualgate_id: java.cookie-no-httponly
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: SF-12
      cwe: "CWE-1004"
