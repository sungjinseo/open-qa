rules:
  - id: java.system-exit
    languages: [java]
    severity: WARNING
    message: "System.exit는 JVM 전체를 강제 종료해 정리 작업과 테스트를 방해합니다. 예외를 던지거나 상위로 종료 코드를 전달하세요."
    pattern: |
      System.exit(...)
    metadata:
      qualgate_id: java.system-exit
      qualgate_severity: medium
      qualgate_category: reliability
