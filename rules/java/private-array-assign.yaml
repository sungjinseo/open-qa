rules:
  - id: java.private-array-assign
    languages: [java]
    severity: INFO
    message: "[행안부 EN-04 Private 배열에 Public 데이터 할당] public 메서드의 인자로 받은 배열을 private 필드에 그대로 대입합니다. 호출자가 보관한 참조로 객체 내부 배열을 몰래 바꿀 수 있습니다. clone()이나 Arrays.copyOf로 복사해 저장하세요."
    pattern-either:
      - pattern: |
          class $C {
            ...
            private $T[] $F;
            ...
            public $R $M(..., $T[] $P, ...) { ... this.$F = $P; ... }
            ...
          }
      - pattern: |
          class $C {
            ...
            private $T[] $F;
            ...
            public $R $M(..., $T[] $P, ...) { ... $F = $P; ... }
            ...
          }
    metadata:
      qualgate_id: java.private-array-assign
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: EN-04
      cwe: "CWE-496"
