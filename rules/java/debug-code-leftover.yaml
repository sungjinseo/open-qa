rules:
  - id: java.debug-code-leftover
    languages: [java]
    severity: INFO
    message: "[행안부 EN-02 제거되지 않고 남은 디버그 코드] 웹 컴포넌트(서블릿·컨트롤러·서비스) 클래스에 main 메서드가 남아 있습니다. 디버그·테스트 용도의 진입점이 운영 코드에 포함되어 내부 동작이 노출될 수 있습니다. 배포 전에 제거하세요."
    pattern-either:
      - pattern: |
          class $C extends HttpServlet {
            ...
            public static void main(String[] $A) {...}
            ...
          }
      - pattern: |
          @Controller
          class $C {
            ...
            public static void main(String[] $A) {...}
            ...
          }
      - pattern: |
          @RestController
          class $C {
            ...
            public static void main(String[] $A) {...}
            ...
          }
      - pattern: |
          @Service
          class $C {
            ...
            public static void main(String[] $A) {...}
            ...
          }
    metadata:
      qualgate_id: java.debug-code-leftover
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: EN-02
      cwe: "CWE-489"
