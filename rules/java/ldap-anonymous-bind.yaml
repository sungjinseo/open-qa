rules:
  - id: java.ldap-anonymous-bind
    languages: [java]
    severity: WARNING
    message: "[행안부 SF-02 부적절한 인가] LDAP 인증 방식을 none으로 지정해 익명으로 디렉터리 서버에 접속합니다. 익명 사용자 권한으로 조회·변경이 이뤄질 수 있습니다. simple 이상의 인증과 최소 권한 계정을 쓰세요."
    pattern-either:
      - pattern: $ENV.put(javax.naming.Context.SECURITY_AUTHENTICATION, "none")
      - pattern: $ENV.put("java.naming.security.authentication", "none")
    metadata:
      qualgate_id: java.ldap-anonymous-bind
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: SF-02
      qualgate_owasp_api: ["API2:2023"]
      cwe: "CWE-285"
