rules:
  - id: kotlin.hardcoded-password
    languages: [kotlin]
    severity: ERROR
    message: "비밀번호나 키를 소스에 하드코딩하면 유출 위험이 있습니다. 환경 변수나 시크릿 저장소에서 읽으세요."
    patterns:
      - pattern: |
          val $P = "..."
      - metavariable-regex:
          metavariable: $P
          regex: '(?i).*(passw|secret|apikey).*'
    metadata:
      qualgate_id: kotlin.hardcoded-password
      qualgate_severity: high
      qualgate_category: security
