rules:
  - id: kotlin.catch-throwable
    languages: [kotlin]
    severity: WARNING
    message: "Throwable을 잡으면 OutOfMemoryError 같은 복구 불가 오류까지 삼킵니다. 구체적인 예외 타입을 잡으세요."
    pattern: |
      try { ... } catch ($E: Throwable) { ... }
    metadata:
      qualgate_id: kotlin.catch-throwable
      qualgate_severity: medium
      qualgate_category: reliability
