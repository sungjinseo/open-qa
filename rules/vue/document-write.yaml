rules:
  - id: vue.document-write
    languages: [javascript, typescript]
    severity: ERROR
    message: "document.write는 입력이 스크립트로 해석될 수 있어 XSS 위험이 있고 렌더링을 막습니다. 템플릿이나 DOM API를 사용하세요."
    paths:
      include: ["*.vue.ts", "*.vue.js"]
    pattern: |
      document.write(...)
    metadata:
      qualgate_id: vue.document-write
      qualgate_severity: high
      qualgate_category: security
