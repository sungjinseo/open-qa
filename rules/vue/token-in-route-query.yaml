rules:
  - id: vue.token-in-route-query
    languages: [javascript, typescript]
    severity: INFO
    message: "[행안부 SF-05 암호화되지 않은 중요정보] 토큰·비밀번호를 라우트 쿼리 문자열에 실어 이동합니다. 브라우저 기록·서버 로그·Referer 헤더에 그대로 남습니다. 상태 저장소(Pinia)나 요청 본문으로 전달하세요."
    paths:
      include: ["*.vue.ts", "*.vue.js"]
    patterns:
      - pattern: '$R.push({..., query: {..., $K: $V, ...}, ...})'
      - metavariable-regex:
          metavariable: $K
          regex: (?i)^(token|access_token|password|secret|api_?key)$
    metadata:
      qualgate_id: vue.token-in-route-query
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: SF-05
      cwe: "CWE-598"
