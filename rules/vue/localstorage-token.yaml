rules:
  - id: vue.localstorage-token
    languages: [javascript, typescript]
    severity: ERROR
    message: "토큰을 localStorage에 저장하면 XSS로 탈취될 수 있습니다. HttpOnly 쿠키를 사용하세요."
    paths:
      include: ["*.vue.ts", "*.vue.js"]
    pattern: |
      localStorage.setItem("token", $V)
    metadata:
      qualgate_id: vue.localstorage-token
      qualgate_severity: high
      qualgate_category: security
