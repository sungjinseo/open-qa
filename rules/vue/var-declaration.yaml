rules:
  - id: vue.var-declaration
    languages: [javascript, typescript]
    severity: INFO
    message: "var는 함수 스코프와 호이스팅 때문에 버그를 만들기 쉽습니다. const나 let을 사용하세요."
    paths:
      include: ["*.vue.ts", "*.vue.js"]
    patterns:
      - pattern-regex: '\bvar\s+[\w$\[{]'
    metadata:
      qualgate_id: vue.var-declaration
      qualgate_severity: low
      qualgate_category: maintainability
