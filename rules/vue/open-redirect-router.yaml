rules:
  - id: vue.open-redirect-router
    languages: [javascript, typescript]
    severity: WARNING
    message: "[행안부 IV-07 신뢰되지 않은 URL주소로 자동접속 연결] 라우트 쿼리·파라미터에서 온 값을 그대로 라우터 이동·새 창 주소로 씁니다. 정상 사이트 링크를 통해 사용자를 피싱 사이트로 보낼 수 있습니다. 이동 경로를 허용 목록과 비교하거나 / 로 시작하는 내부 경로만 허용하세요."
    paths:
      include: ["*.vue.ts", "*.vue.js"]
    mode: taint
    pattern-sources:
      - pattern: $R.query
      - pattern: $R.params
      - pattern: $R.hash

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RT.push($U)
              - pattern: $RT.replace($U)
              - pattern: window.open($U, ...)
              - pattern: window.location.replace($U)
          - focus-metavariable: $U
    pattern-sanitizers:
      - pattern: isSafePath(...)
      - pattern: safeRedirectTarget(...)
    metadata:
      qualgate_id: vue.open-redirect-router
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: IV-07
      cwe: "CWE-601"
