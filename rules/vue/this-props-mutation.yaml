rules:
  - id: vue.this-props-mutation
    languages: [javascript, typescript]
    severity: ERROR
    message: "this.$props를 직접 변경하면 단방향 데이터 흐름이 깨집니다. $emit으로 부모에게 변경을 요청하세요."
    paths:
      include: ["*.vue.ts", "*.vue.js"]
    pattern: |
      this.$props.$K = $V
    metadata:
      qualgate_id: vue.this-props-mutation
      qualgate_severity: high
      qualgate_category: bug
