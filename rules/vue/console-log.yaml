rules:
  - id: vue.console-log
    languages: [javascript, typescript]
    severity: INFO
    message: "console.log는 운영 환경에 디버그 출력을 남깁니다. 제거하거나 로거를 사용하세요."
    paths:
      include: ["*.vue.ts", "*.vue.js"]
    pattern: |
      console.log(...)
    metadata:
      qualgate_id: vue.console-log
      qualgate_severity: low
      qualgate_category: maintainability
