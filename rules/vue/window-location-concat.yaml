rules:
  - id: vue.window-location-concat
    languages: [javascript, typescript]
    severity: WARNING
    message: "[행안부 IV-07 신뢰되지 않은 URL주소로 자동접속 연결] window.location에 문자열을 이어 붙여 이동 주소를 만듭니다. 이어 붙는 값이 외부 입력이면 피싱 사이트로 보내거나 javascript: 주소가 실행될 수 있습니다. URL 객체로 조립하고 허용 경로만 쓰세요."
    paths:
      include: ["*.vue.ts", "*.vue.js"]
    pattern-either:
      - pattern: window.location.href = "..." + $X
      - pattern: window.location.href = `...${$X}...`
      - pattern: window.location.assign("..." + $X)
    metadata:
      qualgate_id: vue.window-location-concat
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: IV-07
      cwe: "CWE-601"
