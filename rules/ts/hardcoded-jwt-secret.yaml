rules:
  - id: ts.hardcoded-jwt-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: "[행안부 SF-06 하드코드된 중요정보] JWT 서명 비밀키가 코드에 박혀 있습니다. 저장소를 볼 수 있는 사람은 누구나 토큰을 위조할 수 있습니다. 환경변수나 시크릿 저장소로 옮기고 이미 노출된 키는 교체하세요."
    pattern-either:
      - pattern: $J.sign($P, "...", ...)
      - pattern: $J.verify($T, "...", ...)
      - pattern: new TextEncoder().encode("...")
    metadata:
      qualgate_id: ts.hardcoded-jwt-secret
      qualgate_severity: critical
      qualgate_category: security
      qualgate_mois: SF-06
      cwe: "CWE-798"
