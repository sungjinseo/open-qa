rules:
  - id: ts.tls-verify-off
    languages: [javascript, typescript]
    severity: ERROR
    message: "[행안부 SF-11 부적절한 인증서 유효성 검증] TLS 인증서 검증을 껐습니다. 중간자 공격으로 통신 내용이 노출·변조될 수 있습니다. rejectUnauthorized를 켜고 사설 CA라면 ca 옵션으로 신뢰 대상을 지정하세요."
    pattern-either:
      - pattern: '{..., rejectUnauthorized: false, ...}'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
    metadata:
      qualgate_id: ts.tls-verify-off
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: SF-11
      cwe: "CWE-295"
