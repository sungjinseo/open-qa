rules:
  - id: ts.debugger-statement
    languages: [javascript, typescript]
    severity: INFO
    message: "[행안부 EN-02 제거되지 않고 남은 디버그 코드] debugger 문이 남아 있습니다. 운영 환경에서 실행이 중단되거나 내부 상태가 노출될 수 있습니다. 배포 전에 제거하세요."
    pattern: debugger;
    metadata:
      qualgate_id: ts.debugger-statement
      qualgate_severity: info
      qualgate_category: security
      qualgate_mois: EN-02
      cwe: "CWE-489"
