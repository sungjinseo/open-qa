rules:
  - id: ts.ldap-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: "[행안부 IV-10 LDAP 삽입] LDAP 검색 필터를 입력값이 섞인 문자열로 만듭니다. 공격자가 필터를 조작해 다른 계정 정보를 조회하거나 인증을 우회할 수 있습니다. 입력값에 LDAP 이스케이프를 적용하세요."
    pattern-either:
      - pattern: '$C.search($BASE, {..., filter: `...${$X}...`, ...}, ...)'
      - pattern: '$C.search($BASE, {..., filter: "..." + $X, ...}, ...)'
    metadata:
      qualgate_id: ts.ldap-injection
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: IV-10
      cwe: "CWE-90"
