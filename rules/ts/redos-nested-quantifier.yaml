rules:
  - id: ts.redos-nested-quantifier
    languages: [javascript, typescript]
    severity: INFO
    message: "[행안부 TS-02 종료되지 않는 반복문 또는 재귀 함수] 정규식에 (a+)+ 처럼 중첩된 반복이 있습니다. 특정 입력에서 매칭 시간이 지수적으로 늘어 서비스가 멈출 수 있습니다(ReDoS). 중첩 반복을 없애거나 입력 길이를 제한하세요."
    pattern-regex: /\^?\((?:[^()\\/]|\\.)*[+*](?:[^()\\/]|\\.)*\)[+*]
    metadata:
      qualgate_id: ts.redos-nested-quantifier
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: TS-02
      cwe: "CWE-1333"
