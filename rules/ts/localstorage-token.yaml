rules:
  - id: ts.localstorage-token
    languages: [javascript, typescript]
    severity: ERROR
    message: "[행안부 SF-05 암호화되지 않은 중요정보] 인증 토큰·비밀번호를 localStorage·sessionStorage에 평문으로 저장합니다. XSS 한 번이면 스크립트가 값을 읽어 갑니다. 세션 토큰은 HttpOnly 쿠키에 두세요."
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem($K, $V)
          - pattern: sessionStorage.setItem($K, $V)
          - pattern: window.localStorage.setItem($K, $V)
      - metavariable-regex:
          metavariable: $K
          regex: (?i)^["'`][^"'`]*(token|jwt|password|passwd|secret|session)[^"'`]*["'`]$
    metadata:
      qualgate_id: ts.localstorage-token
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: SF-05
      cwe: "CWE-922"
