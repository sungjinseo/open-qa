rules:
  - id: ts.path-traversal
    languages: [javascript, typescript]
    severity: ERROR
    message: "[행안부 IV-03 경로 조작 및 자원 삽입] 요청 값이 검증 없이 파일 경로로 쓰입니다. ../ 를 넣어 서버의 다른 파일을 읽거나 지울 수 있습니다. path.basename()으로 파일 이름만 꺼내고 path.resolve 결과가 허용 디렉터리 안인지 확인하세요."
    mode: taint

    pattern-sources:
      - pattern: $REQ.query
      - pattern: $REQ.body
      - pattern: $REQ.params
      - pattern: $REQ.headers
      - pattern: $SP.get(...)
      - pattern: await $REQ.json()
      - pattern: await $REQ.formData()

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FS.readFile($PATH, ...)
              - pattern: $FS.readFileSync($PATH, ...)
              - pattern: $FS.createReadStream($PATH, ...)
              - pattern: $FS.writeFile($PATH, ...)
              - pattern: $FS.writeFileSync($PATH, ...)
              - pattern: $FS.unlink($PATH, ...)
              - pattern: $FS.unlinkSync($PATH, ...)
              - pattern: $RES.sendFile($PATH, ...)
              - pattern: $RES.download($PATH, ...)
          - focus-metavariable: $PATH
    pattern-sanitizers:
      - pattern: path.basename(...)
    metadata:
      qualgate_id: ts.path-traversal
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: IV-03
      cwe: "CWE-22"
