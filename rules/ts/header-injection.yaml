# Adapted from kr-secure-coding (MIT, (c) 2026 ace30126)
rules:
  - id: ts.header-injection
    languages: [javascript, typescript]
    severity: WARNING
    message: "[행안부 IV-13 HTTP 응답분할] 요청 값을 응답 헤더에 그대로 넣습니다. CR/LF가 섞이면 응답이 쪼개져 헤더·본문이 위조될 수 있습니다. 줄바꿈 문자를 제거하거나 값을 인코딩하세요."
    mode: taint

    pattern-sources:
      - pattern: $REQ.query
      - pattern: $REQ.body
      - pattern: $REQ.params
      - pattern: $REQ.headers
      - pattern: searchParams.get(...)
      - pattern: $U.searchParams.get(...)
      - pattern: $R.nextUrl.searchParams.get(...)
      - pattern: new URLSearchParams(...).get(...)
      - patterns:
          - pattern: $SP.get(...)
          - pattern-either:
              - pattern-inside: |
                  const [$SP] = useSearchParams();
                  ...
              - pattern-inside: |
                  const [$SP, $SET] = useSearchParams();
                  ...
              - pattern-inside: |
                  const $SP = useSearchParams();
                  ...
              - pattern-inside: |
                  const $SP = new URLSearchParams(...);
                  ...
      - pattern: await $REQ.json()
      - pattern: await $REQ.formData()

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.setHeader($N, $V)
              - pattern: $RES.set($N, $V)
              - pattern: $RES.header($N, $V)
          - focus-metavariable: $V
    pattern-sanitizers:
      - pattern: encodeURIComponent(...)
    metadata:
      qualgate_id: ts.header-injection
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: IV-13
      cwe: "CWE-113"
