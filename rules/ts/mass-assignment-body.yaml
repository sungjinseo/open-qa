rules:
  - id: ts.mass-assignment-body
    languages: [javascript, typescript]
    severity: WARNING
    message: "[행안부 확장 VC-05 대량 할당·과도한 속성 노출] 요청 본문(req.body) 전체를 모델 생성·수정에 그대로 넘깁니다. 요청에 role·isAdmin·ownerId 같은 필드를 넣으면 그대로 저장됩니다(Mass Assignment). 허용한 필드만 골라 넘기거나 스키마(zod·joi)로 검증한 값만 쓰세요."
    patterns:
      - pattern-either:
          - pattern: Object.assign($O, $REQ.body)
          - pattern: $M.create($REQ.body, ...)
          - pattern: $M.insert($REQ.body, ...)
          - pattern: $M.update($REQ.body, ...)
          - pattern: $M.findByIdAndUpdate($ID, $REQ.body, ...)
          - pattern: $M.updateOne($Q, $REQ.body, ...)
          - pattern: '$M.create({..., data: $REQ.body, ...})'
          - pattern: '$M.update({..., data: $REQ.body, ...})'
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request)$
    metadata:
      qualgate_id: ts.mass-assignment-body
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: VC-05
      qualgate_owasp_api: ["API3:2023"]
      cwe: "CWE-915"
