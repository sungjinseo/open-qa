rules:
  - id: ts.public-env-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: "[행안부 확장 VC-01 클라이언트 번들로 노출되는 비밀키] 비밀키로 보이는 값을 공개 환경변수(NEXT_PUBLIC_·VITE_·REACT_APP_·EXPO_PUBLIC_)로 읽습니다. 이 값은 빌드 때 브라우저 번들에 그대로 포함되어 누구나 볼 수 있습니다. 서버 전용 환경변수로 옮기고 API 라우트를 통해 호출하세요."
    patterns:
      - pattern-either:
          - pattern: process.env.$V
          - pattern: import.meta.env.$V
      - metavariable-regex:
          metavariable: $V
          regex: ^(NEXT_PUBLIC_|VITE_|EXPO_PUBLIC_|REACT_APP_).*(SECRET|SERVICE_ROLE|PRIVATE|OPENAI|ANTHROPIC|GEMINI|STRIPE_SECRET|SK_|PASSWORD|ADMIN).*$
    metadata:
      qualgate_id: ts.public-env-secret
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: VC-01
      cwe: "CWE-200"
