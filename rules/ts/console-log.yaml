rules:
  - id: ts.console-log
    languages: [javascript, typescript]
    severity: INFO
    message: "console.log가 남아 있습니다. 운영 로그에 불필요한 정보가 쌓이거나 내부 값이 노출될 수 있습니다. 로거를 쓰거나 제거하세요."
    pattern: console.log(...)
    metadata:
      qualgate_id: ts.console-log
      qualgate_severity: info
      qualgate_category: maintainability
