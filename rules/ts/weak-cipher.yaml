# Adapted from kr-secure-coding (MIT, (c) 2026 ace30126)
rules:
  - id: ts.weak-cipher
    languages: [javascript, typescript]
    severity: ERROR
    message: "[행안부 SF-04 취약한 암호화 알고리즘 사용] DES·RC4·Blowfish 같은 취약한 암호 알고리즘이나 ECB 모드를 씁니다. 패턴이 그대로 노출되거나 해독될 수 있습니다. AES-256-GCM을 쓰세요."
    patterns:
      - pattern-either:
          - pattern: $C.createCipheriv($ALG, ...)
          - pattern: createCipheriv($ALG, ...)
          - pattern: $C.createCipher($ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)['"](des|des-ede|des-ede3|rc4|rc2|bf|blowfish|aes-\d+-ecb)[^'"]*['"]
    metadata:
      qualgate_id: ts.weak-cipher
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: SF-04
      cwe: "CWE-327"
