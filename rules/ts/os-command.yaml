rules:
  - id: ts.os-command
    languages: [javascript, typescript]
    severity: ERROR
    message: "[행안부 IV-05 운영체제 명령어 삽입] 변수가 섞인 문자열로 셸 명령을 실행합니다. 외부 값이 들어가면 ; 나 && 로 다른 명령을 이어 붙여 서버를 장악할 수 있습니다. execFile이나 spawn에 인자 배열로 넘기고 shell 옵션은 끄세요."
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
          - metavariable-regex:
              metavariable: $CP
              regex: ^(child_process|childProcess|cp|proc)$
          - pattern-not: $CP.$F("...", ...)
      - patterns:
          - pattern-either:
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
          - pattern-either:
              - pattern-inside: |
                  import {..., exec, ...} from "child_process";
                  ...
              - pattern-inside: |
                  import {..., execSync, ...} from "child_process";
                  ...
              - pattern-inside: |
                  const {..., exec, ...} = require("child_process");
                  ...
              - pattern-inside: |
                  const {..., execSync, ...} = require("child_process");
                  ...
          - pattern-not: $F("...", ...)
      - pattern: '$CP.spawn($CMD, $ARGS, {..., shell: true, ...})'
    metadata:
      qualgate_id: ts.os-command
      qualgate_severity: critical
      qualgate_category: security
      qualgate_mois: IV-05
      cwe: "CWE-78"
