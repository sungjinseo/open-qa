rules:
  - id: ts.csrf-disabled
    languages: [javascript, typescript]
    severity: WARNING
    message: "[행안부 IV-11 크로스사이트 요청 위조] CSRF 방어를 끈 설정입니다. 로그인한 사용자의 브라우저를 이용해 공격자가 상태 변경 요청을 보낼 수 있습니다. CSRF 토큰을 쓰거나 sameSite 쿠키와 Origin 검증을 적용하세요."
    pattern-either:
      - pattern: '{..., csrf: false, ...}'
      - pattern: '{..., csrfProtection: false, ...}'
      - pattern: '{..., checkOrigin: false, ...}'
    metadata:
      qualgate_id: ts.csrf-disabled
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: IV-11
      cwe: "CWE-352"
