rules:
  - id: ts.loose-null-eq
    languages: [javascript, typescript]
    severity: INFO
    message: "null과 느슨한 비교(==, !=)를 합니다. undefined도 함께 걸려 의도와 다를 수 있습니다. === 를 사용해 의도를 명확히 하세요."
    pattern-either:
      - pattern: $X == null
      - pattern: $X != null
    metadata:
      qualgate_id: ts.loose-null-eq
      qualgate_severity: low
      qualgate_category: maintainability
