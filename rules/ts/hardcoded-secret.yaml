rules:
  - id: ts.hardcoded-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: "[행안부 SF-06 하드코드된 중요정보] 비밀번호·API 키로 보이는 값이 소스에 문자열로 박혀 있습니다. 저장소와 번들에 그대로 노출됩니다. 환경변수나 서버 측 시크릿 저장소로 옮기세요. (환경변수 이름, 화면 라벨, 8자 미만 값, 영문자만 있는 단어는 제외합니다.)"
    patterns:
      - pattern-either:
          - pattern: const $P = "$S"
          - pattern: let $P = "$S"
          - pattern: '{..., $P: "$S", ...}'
      - metavariable-regex:
          metavariable: $P
          regex: (?i)^(\w*(passw|secret|apikey|api_key|privatekey|private_key|accesskey|access_key)\w*)$
      - metavariable-regex:
          metavariable: $S
          regex: ^(?![A-Z][A-Z0-9_]*$)(?=.{8,}$)(?=.*[^A-Za-z])(?!.*\s).*$
    metadata:
      qualgate_id: ts.hardcoded-secret
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: SF-06
      cwe: "CWE-798"
