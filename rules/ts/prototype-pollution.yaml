rules:
  - id: ts.prototype-pollution
    languages: [javascript, typescript]
    severity: ERROR
    message: "[행안부 확장 VC-04 프로토타입 오염] 외부 객체의 키를 그대로 대상 객체에 복사합니다. __proto__ 키가 들어오면 모든 객체의 프로토타입이 오염됩니다. __proto__·constructor·prototype 키를 걸러내거나 Object.create(null)·Map을 쓰세요."
    pattern-either:
      - patterns:
          - pattern: |
              for ($K in $SRC) {
                ...
                $DST[$K] = $V;
                ...
              }
          - pattern-not-inside: |
              for ($K in $SRC) {
                ...
                if ($COND) { ... }
                ...
              }
      - pattern: $L.merge($T, $REQ.body)
      - pattern: $L.defaultsDeep($T, $REQ.body)
    metadata:
      qualgate_id: ts.prototype-pollution
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: VC-04
      cwe: "CWE-1321"
