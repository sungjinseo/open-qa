rules:
  - id: ts.short-rsa-key
    languages: [javascript, typescript]
    severity: WARNING
    message: "[행안부 SF-07 충분하지 않은 키 길이 사용] RSA 키 길이가 2048비트 미만입니다. 현재 컴퓨팅 능력으로 인수분해될 수 있습니다. 2048비트 이상(권장 3072)을 쓰세요."
    patterns:
      - pattern-either:
          - pattern: '$C.generateKeyPair("rsa", {..., modulusLength: $N, ...}, ...)'
          - pattern: '$C.generateKeyPairSync("rsa", {..., modulusLength: $N, ...})'
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 2048
    metadata:
      qualgate_id: ts.short-rsa-key
      qualgate_severity: medium
      qualgate_category: security
      qualgate_mois: SF-07
      cwe: "CWE-326"
