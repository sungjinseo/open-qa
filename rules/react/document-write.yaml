rules:
  - id: react.document-write
    languages: [javascript, typescript]
    severity: ERROR
    message: "document.write는 입력이 스크립트로 해석될 수 있어 XSS 위험이 있고 렌더링을 막습니다. DOM API로 노드를 추가하세요."
    paths:
      include: ["*.jsx", "*.tsx"]
    pattern: |
      document.write(...)
    metadata:
      qualgate_id: react.document-write
      qualgate_severity: high
      qualgate_category: security
