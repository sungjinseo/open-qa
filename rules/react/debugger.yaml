rules:
  - id: react.debugger
    languages: [javascript, typescript]
    severity: WARNING
    message: "debugger 문이 남아 있으면 브라우저가 실행을 멈춥니다. 커밋 전에 제거하세요."
    paths:
      include: ["*.jsx", "*.tsx"]
    pattern: |
      debugger;
    metadata:
      qualgate_id: react.debugger
      qualgate_severity: medium
      qualgate_category: maintainability
