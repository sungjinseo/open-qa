rules:
  - id: react.loose-null-eq
    languages: [javascript, typescript]
    severity: INFO
    message: "== null은 undefined도 함께 통과시켜 의도가 불분명합니다. === null과 === undefined를 명시하세요."
    paths:
      include: ["*.jsx", "*.tsx"]
    pattern: |
      $X == null
    metadata:
      qualgate_id: react.loose-null-eq
      qualgate_severity: low
      qualgate_category: maintainability
