rules:
  - id: react.effect-no-cleanup
    languages: [javascript, typescript]
    severity: INFO
    message: "[행안부 CE-02 부적절한 자원 해제] useEffect에서 setInterval·addEventListener를 등록하고 정리(cleanup) 함수를 반환하지 않습니다. 컴포넌트가 사라져도 타이머와 리스너가 남아 메모리와 자원이 누수됩니다. return () => clearInterval(...) 처럼 정리하세요."
    paths:
      include: ["*.jsx", "*.tsx"]
    patterns:
      - pattern-either:
          - pattern: useEffect(() => {... setInterval(...); ...}, ...)
          - pattern: useEffect(() => {... $W.addEventListener(...); ...}, ...)
      - pattern-not: useEffect(() => {... return () => {...}; }, ...)
      - pattern-not: useEffect(() => {... return () => $E; }, ...)
    metadata:
      qualgate_id: react.effect-no-cleanup
      qualgate_severity: low
      qualgate_category: security
      qualgate_mois: CE-02
      cwe: "CWE-404"
