rules:
  - id: react.href-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: "[행안부 IV-04 크로스사이트 스크립트] 링크의 href가 javascript: 주소입니다. 클릭하면 페이지 권한으로 스크립트가 실행되어 XSS 통로가 됩니다. 이벤트 핸들러(onClick)나 정상 URL을 쓰세요."
    paths:
      include: ["*.jsx", "*.tsx"]
    patterns:
      - pattern: <a href=$H />
      - metavariable-regex:
          metavariable: $H
          regex: '^["'']javascript:'
    metadata:
      qualgate_id: react.href-javascript
      qualgate_severity: high
      qualgate_category: security
      qualgate_mois: IV-04
      cwe: "CWE-79"
