rules:
  - id: react.array-index-key
    languages: [javascript, typescript]
    severity: WARNING
    message: "배열 인덱스를 key로 쓰면 순서가 바뀔 때 상태가 엉킵니다. 항목의 고유 id를 key로 사용하세요."
    paths:
      include: ["*.jsx", "*.tsx"]
    pattern: |
      $A.map(($I, $K) => <$T key={$K} ... />)
    metadata:
      qualgate_id: react.array-index-key
      qualgate_severity: medium
      qualgate_category: bug
