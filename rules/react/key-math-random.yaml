rules:
  - id: react.key-math-random
    languages: [javascript, typescript]
    severity: WARNING
    message: "key에 Math.random()·Date.now()를 씁니다. 렌더링마다 키가 바뀌어 모든 항목이 매번 다시 만들어지고 입력 상태가 사라집니다. 항목의 고유한 안정 id를 key로 쓰세요."
    paths:
      include: ["*.jsx", "*.tsx"]
    pattern-either:
      - pattern: <$T key={Math.random()} ... />
      - pattern: <$T key={Date.now()} ... />
      - pattern: <$T key={crypto.randomUUID()} ... />
    metadata:
      qualgate_id: react.key-math-random
      qualgate_severity: medium
      qualgate_category: bug
