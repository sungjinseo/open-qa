rules:
  - id: react.settimeout-string
    languages: [javascript, typescript]
    severity: ERROR
    message: "setTimeout에 문자열을 넘기면 eval처럼 실행되어 코드 인젝션 위험이 있습니다. 함수를 전달하세요."
    paths:
      include: ["*.jsx", "*.tsx"]
    pattern: |
      setTimeout("...", ...)
    metadata:
      qualgate_id: react.settimeout-string
      qualgate_severity: high
      qualgate_category: security
