rules:
  - id: react.hardcoded-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: "비밀번호나 키를 소스에 하드코딩하면 번들에 노출됩니다. 환경 변수나 서버 측 시크릿 저장소를 사용하세요."
    paths:
      include: ["*.jsx", "*.tsx"]
    patterns:
      - pattern: |
          const $P = "..."
      - metavariable-regex:
          metavariable: $P
          regex: '(?i).*(passw|secret|apikey).*'
    metadata:
      qualgate_id: react.hardcoded-secret
      qualgate_severity: high
      qualgate_category: security
