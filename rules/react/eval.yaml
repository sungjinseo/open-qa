rules:
  - id: react.eval
    languages: [javascript, typescript]
    severity: ERROR
    message: "eval은 문자열을 코드로 실행해 임의 코드 실행 위험이 있습니다. JSON.parse 등 명시적 파서를 사용하세요."
    paths:
      include: ["*.jsx", "*.tsx"]
    pattern: |
      eval(...)
    metadata:
      qualgate_id: react.eval
      qualgate_severity: critical
      qualgate_category: security
